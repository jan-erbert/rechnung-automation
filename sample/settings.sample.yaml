paths:
  data_dir: data
  customers_dir: customers
  invoice_config: config/invoice.yaml
  templates_dir: templates
  image_dir: img
  hours_dir: hours
  backup_dir: backup

pdf:
  engine: weasyprint

design:
  pdf:
    accent_color: "#2f3c50"
    accent_text_color: "#ffffff"
    accent_muted_text_color: "#dbe2ea"
  mail:
    accent_color: "#2f3c50"
    link_color: "#007BFF"

branding:
  pdf_logo: logo.png
  mail_logo: null
  pdf_logo_height: 40
  mail_logo_height: 60
  header_title: null
  header_subtitle: null

file_naming:
  invoice_prefix: Rechnung
  preview_prefix: VORSCHAU

logging:
  enabled: true
  directory: logs
  level: INFO
  retention_files: 100

backup:
  enabled: true
  keep_last: 30

mail:
  security: starttls
  timeout_seconds: 30
