name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            install/requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r install/requirements.txt
          python -m pip install -r install/requirements-dev.txt

      - name: Tests ausfuehren
        run: python -m pytest --junitxml=pytest-results.xml

      - name: Testfehler als Annotationen ausgeben
        if: failure()
        run: python tools/annotate_junit.py pytest-results.xml

      - name: PowerShell-Syntax pruefen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $powerShellFiles = Get-ChildItem -Path . -Recurse -Filter "*.ps1" -File
          $parseFailures = foreach ($file in $powerShellFiles) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref] $tokens,
                  [ref] $parseErrors
              ) | Out-Null

              foreach ($parseError in $parseErrors) {
                  "$($file.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
          }

          if ($parseFailures) {
              $parseFailures | ForEach-Object { Write-Error $_ }
              exit 1
          }

  quality:
    name: Statische Qualitaetspruefungen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            install/requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r install/requirements.txt
          python -m pip install -r install/requirements-dev.txt

      - name: Black pruefen
        run: >-
          python -m black --check --diff --no-cache --workers 1
          src tools tests install integrations

      - name: Flake8 ausfuehren
        run: python -m flake8 --jobs 1 src tools tests install integrations

      - name: Shell-Syntax pruefen
        run: >-
          bash -n
          install/install.sh
          invoice_cron.sh
          generate_invoices.sh

  zugferd:
    name: ZUGFeRD integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUN_ZUGFERD_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Linux PDF-Systembibliotheken
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: macOS PDF-Systembibliotheken
        if: runner.os == 'macOS'
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Windows PDF-Systembibliotheken
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-pango
          update: false
      - name: Windows PDF-Bibliothekspfad
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $dllPath = Join-Path $env:MSYS2_LOCATION "mingw64\bin"
          "WEASYPRINT_DLL_DIRECTORIES=$dllPath" >> $env:GITHUB_ENV
      - name: Optionale Pakete ausdruecklich installieren
        run: |
          python -m pip install -r install/requirements.txt -r install/requirements-dev.txt
          python tools/install_zugferd.py --install
      - name: Lokale ZUGFeRD-Erzeugung und Validierung
        run: python -m pytest tests/test_zugferd_integration.py
