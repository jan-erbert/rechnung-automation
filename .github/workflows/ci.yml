name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            install/requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r install/requirements.txt
          python -m pip install -r install/requirements-dev.txt

      - name: Tests ausfuehren
        run: python -m pytest

      - name: PowerShell-Syntax pruefen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $powerShellFiles = Get-ChildItem -Path . -Recurse -Filter "*.ps1" -File
          $parseFailures = foreach ($file in $powerShellFiles) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref] $tokens,
                  [ref] $parseErrors
              ) | Out-Null

              foreach ($parseError in $parseErrors) {
                  "$($file.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
          }

          if ($parseFailures) {
              $parseFailures | ForEach-Object { Write-Error $_ }
              exit 1
          }

  quality:
    name: Statische Qualitaetspruefungen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            install/requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r install/requirements.txt
          python -m pip install -r install/requirements-dev.txt

      - name: Black pruefen
        run: >-
          python -m black --check --no-cache --workers 1
          src tools tests install

      - name: Flake8 ausfuehren
        run: python -m flake8 --jobs 1 src tools tests install

      - name: Shell-Syntax pruefen
        run: >-
          bash -n
          install/install.sh
          invoice_cron.sh
          generate_invoices.sh
