paths:
  data_dir: data
  customers_dir: customers
  invoice_config: config/invoice.yaml
  templates_dir: templates
  image_dir: img
  hours_dir: hours
  backup_dir: backup

pdf:
  engine: weasyprint
  # Optional nach Zusatzinstallation: zugferd (Profil EN 16931).
  format: pdf

design:
  # Seitenabstaende in mm, jeweils 5 bis 30.
  pdf_layout:
    margin_top_mm: 15
    margin_right_mm: 15
    margin_bottom_mm: 15
    margin_left_mm: 15
  tables:
    header_background: "#F1F3F5"
    total_background: "#EEF1F3"
    border_color: "#D9DEE3"
    header_text_color: "#303942"
    body_text_color: "#111827"
    row_background: "#FFFFFF"
  pdf:
    accent_color: "#2f3c50"
    accent_text_color: "#ffffff"
    accent_muted_text_color: "#dbe2ea"
  mail:
    accent_color: "#243447"
    link_color: "#007BFF"

branding:
  pdf_logo: sample_logo.png
  mail_logo: mail_logo.png
  # false blendet alle dekorativen Mail-Symbole aus.
  mail_icons_enabled: true
  mail_automation_notice_enabled: false
  pdf_logo_height: 40
  mail_logo_height: 60
  header_title: null
  header_subtitle: null

file_naming:
  invoice_prefix: Rechnung
  preview_prefix: VORSCHAU

logging:
  enabled: true
  directory: logs
  level: INFO
  retention_files: 100

backup:
  enabled: true
  keep_last: 30

mail:
  security: starttls
  timeout_seconds: 30
